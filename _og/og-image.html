<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image - Caleb Automates</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Source for public/og-image.png (1200x630). Re-render with the web-screenshot tool:
     powershell -File C:\Users\Caleb\Workspace\.claude\tools\web-screenshot.ps1 "file:///C:/Users/Caleb/Workspace/calebautomates/_og/og-image.html" -Out C:\Users\Caleb\Workspace\calebautomates\public\og-image.png -Width 1200 -Height 630 -WaitMs 3000 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f6f2;
    color: #28251d;
    font-family: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1200px; height: 630px;
    padding: 64px 80px;
    display: flex; flex-direction: column;
    border-top: 10px solid #01696f;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 44px; height: 44px; }
  .wordmark { font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .main { margin-top: auto; margin-bottom: auto; }
  .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #66655f; margin-bottom: 28px; }
  h1 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 84px;
    line-height: 1.08;
    letter-spacing: -0.015em;
    color: #28251d;
    max-width: 1000px;
  }
  .sub { margin-top: 32px; font-size: 32px; color: #66655f; }
  .url { font-size: 26px; font-weight: 600; color: #01696f; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true">
        <rect x="2" y="2" width="8" height="8" rx="2" fill="#01696f" opacity=".9"/>
        <rect x="12" y="2" width="8" height="8" rx="2" fill="#01696f" opacity=".4"/>
        <rect x="2" y="12" width="8" height="8" rx="2" fill="#01696f" opacity=".4"/>
        <rect x="12" y="12" width="8" height="8" rx="2" fill="#01696f" opacity=".7"/>
      </svg>
      <span class="wordmark">Caleb Automates</span>
    </div>
    <div class="main">
      <div class="eyebrow">Automation &amp; systems consulting · Kansas City</div>
      <h1>Systems that run your business without you.</h1>
      <p class="sub">I help small businesses optimize and scale.</p>
    </div>
    <div class="url">calebautomates.com</div>
  </div>
</body>
</html>
